################
### MONITORS ###
################


monitor=,highres,auto,1
monitor = eDP-1, 1920x1200, auto, 1.25
monitor = DP-8, 2560x1440@120, auto, 1

#Wayland scaling
xwayland {
  force_zero_scaling = true
  create_abstract_socket = true
}
env = GDK_SCALE,1
env = XCURSOR_SIZE,24








###################
### MY PROGRAMS ###
###################

$terminal = kitty
$fileManager = nautilus
$menu = vicinae open





#################
### AUTOSTART ###
#################
exec-once = sudo docker compose --file /home/plazma/.config/winapps/compose.yaml up
exec-once = swayidle before-sleep "hyprlock --no-fade-in"
exec-once = hyprpaper
exec-once = waybar
exec-once = swaync
exec-once = hyprctl setcursor macOS-White 28
exec-once = gsettings set org.gnome.desktop.interface cursor-theme 'mcmojave-cursors'
exec-once = wl-paste --watch cliphist store
exec-once = nm-applet
exec-once = vicinae server






#############################
### ENVIRONMENT VARIABLES ###
#############################

env = GDK_SCALE,2
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 5
    gaps_out = 5

    border_size = 2

    col.active_border = rgb(d4c787)
    col.inactive_border = rgba(595959aa)

    resize_on_border = false
    allow_tearing = false

    layout = master
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = false
    }


    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}


animations {
    enabled = no
	bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1
    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

misc {
    force_default_wallpaper = -1
	disable_hyprland_logo = true
}




#############
### INPUT ###
#############

input {
    kb_layout = us,ru
    kb_options = grp:win_space_toggle, caps:escape

    follow_mouse = 1
	mouse_refocus = false

    sensitivity = 0
    touchpad {
        natural_scroll = true
		disable_while_typing = false
    }
}







###################
### KEYBINDINGS ###
###################
$mainMod = SUPER




#Open apps
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, E, exec, kitty -e fish -c "mc"
bind = $mainMod, F, exec, firefox-nightly
bind = ALT, E, exec, $fileManager
bind = $mainMod, T, exec, Telegram




#Menu
bind = $mainMod, R, exec, $menu
bind = $mainMod, L, exec, hyprlock




#Printscreen
bind = ALT, P, exec, grim -g"$(slurp)" - | wl-copy




#Move focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d



bind = $mainMod, H, submap, resize

submap = resize
bind = , right, resizeactive, 10 0   # Resize right by 10px
bind = , left, resizeactive, -10 0  # Resize left by 10px
bind = , up, resizeactive, 0 -10   # Resize up by 10px
bind = , down, resizeactive, 0 10  # Resize down by 10px

bind = , Return, submap, reset
bind = , escape, submap, reset
submap = reset



#Manipulations with windows
bind = $mainMod, M, exit,
bind = $mainMod, C, killactive,
bind = ALT, F, fullscreen,
bind = $mainMod, J, togglesplit,
bind = $mainMod, P, togglefloating,
bindr = $mainMod, D, layoutmsg, swapwithmaster
bindr = $mainMod, S, layoutmsg, rollprev
bindr = $mainMod, A, layoutmsg, rollnext

bind = $mainMod, H, exec, hyprctl keyword monitor 'DP-8,disable'
bind = $mainMod, J, exec, hyprctl keyword monitor 'DP-8,enable'



#Switch workspaces 
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10




#Move window to workspace
bind = $mainMod ALT, 1, movetoworkspace, 1
bind = $mainMod ALT, 2, movetoworkspace, 2
bind = $mainMod ALT, 3, movetoworkspace, 3
bind = $mainMod ALT, 4, movetoworkspace, 4
bind = $mainMod ALT, 5, movetoworkspace, 5
bind = $mainMod ALT, 6, movetoworkspace, 6
bind = $mainMod ALT, 7, movetoworkspace, 7
bind = $mainMod ALT, 8, movetoworkspace, 8
bind = $mainMod ALT, 9, movetoworkspace, 9
bind = $mainMod ALT, 0, movetoworkspace, 10




#Move/resize windows
bindm = $mainMod, mouse:272, movewindow
bindm = ALT, mouse:272, resizewindow




#Multimedia keys
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 1%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 1%-
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous



#Switches
bindl=,switch:Lid Switch, exec, hyprlock --no-fade-in












##############################
### WINDOWS AND WORKSPACES ###
##############################

#Layouts
dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}
